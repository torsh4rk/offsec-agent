name: Financial AI Red Team — offline tests

on:
  push:
    paths:
      - 'financial-ai-redteam/**'
      - '.github/workflows/financial-ai-redteam-tests.yml'
  pull_request:
    paths:
      - 'financial-ai-redteam/**'
      - '.github/workflows/financial-ai-redteam-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check modules
        working-directory: financial-ai-redteam
        run: python -m compileall -q financial_redteam
      - name: Run offline tests (no OpenCode/network dependencies)
        working-directory: financial-ai-redteam
        run: python -m unittest discover -s tests -v
